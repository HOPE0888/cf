
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickPick - 扫码自提系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "react-router-dom": "https://esm.sh/react-router-dom@6.11.2",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/"
  }
}
</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #f1f5f9; 
            -webkit-tap-highlight-color: transparent;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        .animate-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); }
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:active { transform: scale(0.98); }
    </style>
</head>
<body>
    <div id="root">
        <div class="min-h-screen flex items-center justify-center bg-white">
            <div class="flex flex-col items-center">
                <div class="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-400 font-bold tracking-widest text-xs uppercase">Loading System...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { HashRouter, Routes, Route, Link, useNavigate, useParams } from 'react-router-dom';

        const INITIAL_PRODUCTS = [
            { id: 'p1', name: { zh: '精选美式', ja: 'ブラックコーヒー' }, price: 400, image: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400', description: { zh: '经典现磨，香气浓郁。', ja: '香りが強いブラック。' } },
            { id: 'p2', name: { zh: '招牌厚乳拿铁', ja: '厚乳ラテ' }, price: 550, image: 'https://images.unsplash.com/photo-1559496417-e7f25cb247f3?w=400', description: { zh: '口感顺滑，奶香持久。', ja: '滑らかな口当たり。' } },
            { id: 'p3', name: { zh: '草莓芝士蛋糕', ja: 'いちごケーキ' }, price: 680, image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=400', description: { zh: '新鲜草莓，甜而不腻。', ja: '新鮮ないちごを使用。' } }
        ];

        const UI = {
            zh: { shop: '快速自提店', items: '件商品', checkout: '结算', total: '合计', code: '取货码', confirm: '确认下单', wechat: '微信昵称', back: '回主页' },
            ja: { shop: 'クイック店', items: '点', checkout: 'レジへ', total: '合計', code: '受取コード', confirm: '注文を確定', wechat: 'WeChat名', back: '戻る' }
        };

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [cart, setCart] = useState([]);
            const [rate, setRate] = useState(0.048);
            const [orders, setOrders] = useState([]);
            const t = UI[lang];

            const addToCart = (p) => {
                setCart(prev => {
                    const exist = prev.find(i => i.id === p.id);
                    return exist ? prev.map(i => i.id === p.id ? {...i, qty: i.qty + 1} : i) : [...prev, {...p, qty: 1}];
                });
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.map(i => i.id === id ? {...i, qty: i.qty - 1} : i).filter(i => i.qty > 0));
            };

            return (
                <HashRouter>
                    <div className="max-w-md mx-auto min-h-screen bg-white flex flex-col shadow-2xl overflow-x-hidden">
                        <nav className="glass-nav p-4 border-b flex justify-between items-center sticky top-0 z-50">
                            <Link to="/" className="font-black text-2xl text-indigo-600 italic tracking-tighter">QUICKPICK.</Link>
                            <select value={lang} onChange={e => setLang(e.target.value)} className="text-xs bg-slate-100 border-none rounded-full px-3 py-1 font-black uppercase">
                                <option value="zh">CN</option>
                                <option value="ja">JP</option>
                            </select>
                        </nav>

                        <main className="flex-1 p-4">
                            <Routes>
                                <Route path="/" element={<Shop t={t} lang={lang} cart={cart} onAdd={addToCart} onRemove={removeFromCart} rate={rate} />} />
                                <Route path="/checkout" element={<Checkout t={t} cart={cart} rate={rate} onOrder={(o) => {setOrders([o, ...orders]); setCart([]); return o;}} />} />
                                <Route path="/done/:id" element={<Done t={t} orders={orders} />} />
                                <Route path="/admin" element={<Admin orders={orders} rate={rate} setRate={setRate} />} />
                            </Routes>
                        </main>
                    </div>
                </HashRouter>
            );
        };

        const Shop = ({ t, lang, cart, onAdd, onRemove, rate }) => {
            const totalQty = cart.reduce((s, i) => s + i.qty, 0);
            const totalJPY = cart.reduce((s, i) => s + i.price * i.qty, 0);

            return (
                <div className="animate-in pb-24">
                    <div className="bg-gradient-to-br from-indigo-600 to-indigo-800 rounded-3xl p-6 text-white mb-6 shadow-xl shadow-indigo-100">
                        <h2 className="text-2xl font-black italic">WELCOME.</h2>
                        <p className="text-[10px] font-bold opacity-70 mt-1 uppercase tracking-widest">扫码下单 · 汇率 1:0.048</p>
                    </div>

                    <div className="space-y-4">
                        {INITIAL_PRODUCTS.map(p => (
                            <div key={p.id} className="product-card bg-white p-3 rounded-2xl border border-slate-100 shadow-sm flex gap-4">
                                <img src={p.image} className="w-24 h-24 object-cover rounded-xl shadow-inner bg-slate-100" />
                                <div className="flex-1 flex flex-col justify-between py-1">
                                    <div>
                                        <h3 className="font-black text-slate-800 leading-tight">{p.name[lang]}</h3>
                                        <p className="text-[10px] text-slate-400 mt-1">{p.description[lang]}</p>
                                    </div>
                                    <div className="flex justify-between items-end">
                                        <div>
                                            <p className="text-indigo-600 font-black text-lg">¥{p.price}</p>
                                            <p className="text-[10px] text-emerald-500 font-bold leading-none">≈ ￥{(p.price * rate).toFixed(2)}</p>
                                        </div>
                                        <div className="flex items-center gap-3 bg-slate-50 p-1 rounded-full border border-slate-200">
                                            <button onClick={() => onRemove(p.id)} className="w-6 h-6 flex items-center justify-center rounded-full bg-white border shadow-sm">-</button>
                                            <span className="text-xs font-black w-4 text-center">{cart.find(i => i.id === p.id)?.qty || 0}</span>
                                            <button onClick={() => onAdd(p)} className="w-6 h-6 flex items-center justify-center rounded-full bg-slate-900 text-white shadow-md">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {totalQty > 0 && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-sm glass-nav border border-slate-200 p-4 rounded-3xl shadow-2xl flex justify-between items-center animate-in">
                            <div>
                                <p className="text-[10px] font-black text-slate-400 uppercase tracking-tighter">{totalQty} {t.items}</p>
                                <p className="text-xl font-black text-slate-900 leading-none">¥{totalJPY} <span className="text-xs opacity-40">JPY</span></p>
                            </div>
                            <Link to="/checkout" className="bg-indigo-600 text-white px-6 py-3 rounded-2xl font-black text-sm shadow-lg shadow-indigo-100 hover:bg-indigo-700 transition-colors">
                                {t.checkout} <i className="fa-solid fa-arrow-right ml-1"></i>
                            </Link>
                        </div>
                    )}
                </div>
            );
        };

        const Checkout = ({ t, cart, rate, onOrder }) => {
            const [form, setForm] = useState({ wechat: '', img: '' });
            const nav = useNavigate();
            const jpy = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const cny = (jpy * rate).toFixed(2);

            const handleImg = (e) => {
                const reader = new FileReader();
                reader.onloadend = () => setForm({...form, img: reader.result});
                reader.readAsDataURL(e.target.files[0]);
            };

            return (
                <div className="animate-in space-y-6">
                    <h2 className="text-2xl font-black italic text-slate-800">CHECKOUT.</h2>
                    <div className="bg-slate-50 p-5 rounded-3xl border border-dashed border-slate-200">
                        {cart.map(i => <div key={i.id} className="flex justify-between text-sm mb-1"><span>{i.name.zh} x{i.qty}</span><span className="font-bold text-slate-600">¥{i.price * i.qty}</span></div>)}
                        <div className="border-t border-slate-200 mt-3 pt-3 flex justify-between items-center">
                            <span className="text-xs font-black text-slate-400">TOTAL</span>
                            <div className="text-right">
                                <p className="text-xl font-black text-indigo-600 leading-none">¥{jpy}</p>
                                <p className="text-xs font-bold text-emerald-500">￥{cny} CNY</p>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-[32px] shadow-xl border border-slate-100 text-center">
                        <p className="text-[10px] font-black text-slate-400 mb-4 uppercase tracking-[0.2em]">Scan QR to Pay ￥{cny}</p>
                        <div className="bg-slate-100 p-2 rounded-2xl inline-block mb-4">
                            <img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=PAY_CNY" className="w-32 h-32" />
                        </div>
                        <label className="block w-full border-2 border-dashed border-slate-100 rounded-2xl p-4 cursor-pointer hover:bg-slate-50 transition-colors">
                            <input type="file" onChange={handleImg} className="hidden" />
                            {form.img ? <img src={form.img} className="w-16 h-16 object-cover mx-auto rounded-lg shadow-md" /> : <div className="text-xs font-bold text-slate-400"><i className="fa-solid fa-camera mb-1 text-lg block"></i> 上传付款凭证</div>}
                        </label>
                    </div>

                    <input value={form.wechat} onChange={e => setForm({...form, wechat: e.target.value})} placeholder={t.wechat} className="w-full p-5 rounded-2xl bg-slate-50 border-none font-bold text-sm focus:ring-2 focus:ring-indigo-600" />
                    
                    <button onClick={() => { if(!form.wechat || !form.img) return alert("请填写微信并上传支付凭证"); const o = onOrder({id: Date.now(), wechat: form.wechat, code: Math.random().toString(36).substr(2,6).toUpperCase(), cny}); nav(`/done/${o.id}`); }} className="w-full bg-slate-900 text-white py-5 rounded-3xl font-black text-lg shadow-2xl">
                        {t.confirm}
                    </button>
                </div>
            );
        };

        const Done = ({ t, orders }) => {
            const { id } = useParams();
            const o = orders.find(x => x.id == id);
            return (
                <div className="text-center py-10 animate-in">
                    <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner"><i className="fa-solid fa-check"></i></div>
                    <h2 className="text-3xl font-black italic tracking-tight">DONE!</h2>
                    <p className="text-slate-400 text-[10px] font-bold mt-2 uppercase tracking-widest">请截图保存取货码</p>
                    <div className="mt-10 bg-white p-10 rounded-[48px] shadow-2xl border border-slate-50 relative">
                        <div className="absolute top-0 left-0 w-full h-1 bg-indigo-600 rounded-full opacity-20"></div>
                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.4em]">{t.code}</p>
                        <p className="text-7xl font-black text-indigo-600 mt-4 tracking-tighter">{o?.code}</p>
                    </div>
                    <Link to="/" className="inline-block mt-12 text-slate-300 font-black text-xs uppercase tracking-widest hover:text-indigo-600 border-b-2 border-transparent hover:border-indigo-600 transition-all">{t.back}</Link>
                </div>
            );
        };

        const Admin = ({ orders, rate, setRate }) => {
            return (
                <div className="space-y-6 animate-in">
                    <div className="bg-slate-900 text-white p-6 rounded-3xl">
                        <h3 className="text-xs font-black uppercase tracking-widest mb-3 opacity-50">Settings</h3>
                        <p className="text-[10px] mb-1 font-bold">Exchange Rate (1 JPY = ? CNY)</p>
                        <input type="number" step="0.001" value={rate} onChange={e => setRate(parseFloat(e.target.value))} className="w-full bg-white/10 border-none rounded-xl p-3 text-lg font-black text-indigo-300" />
                    </div>
                    <h3 className="font-black text-slate-800 text-sm uppercase tracking-widest">Orders ({orders.length})</h3>
                    <div className="space-y-3">
                        {orders.map(o => (
                            <div key={o.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                                <div>
                                    <p className="text-2xl font-black text-indigo-600 tracking-tighter">{o.code}</p>
                                    <p className="text-[10px] font-black text-slate-300 uppercase">{o.wechat}</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-sm font-black text-emerald-500">￥{o.cny}</p>
                                    <button className="text-[10px] font-bold bg-slate-100 px-3 py-1 rounded-full text-slate-400 mt-1 uppercase tracking-tighter">Prepare</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
