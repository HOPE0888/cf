
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickPick - 扫码自提系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .animate-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        #root:empty + #error-display { display: flex; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0"
  }
}
</script>
</head>
<body>
    <div id="root">
        <!-- 初始加载动画 -->
        <div class="min-h-screen flex items-center justify-center bg-white">
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <p class="mt-4 text-slate-400 font-bold tracking-widest text-[10px] uppercase">Initializing System...</p>
                <p id="timer" class="mt-2 text-slate-300 text-[8px]">0s</p>
            </div>
        </div>
    </div>

    <!-- 错误提示（仅在加载失败时显示） -->
    <div id="error-display" class="hidden fixed inset-0 bg-white z-[100] flex-col items-center justify-center p-6 text-center">
        <i class="fa-solid fa-triangle-exclamation text-4xl text-red-500 mb-4"></i>
        <h3 class="font-bold text-slate-800">加载失败 / Load Failed</h3>
        <p class="text-sm text-slate-500 mt-2">可能是网络问题或浏览器版本过低，请尝试刷新页面。</p>
        <button onclick="window.location.reload()" class="mt-6 bg-indigo-600 text-white px-8 py-3 rounded-2xl font-bold">刷新重试</button>
    </div>

    <script type="module">
        // 监控加载时间
        let seconds = 0;
        const timerInterval = setInterval(() => {
            seconds++;
            const timerEl = document.getElementById('timer');
            if(timerEl) timerEl.innerText = seconds + 's';
            if(seconds > 10) {
                document.getElementById('error-display').classList.remove('hidden');
                clearInterval(timerInterval);
            }
        }, 1000);

        // 使用直接 URL 导入，解决 importmap 兼容性问题
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { HashRouter, Routes, Route, Link, useNavigate, useParams } from 'https://esm.sh/react-router-dom@6.11.2?external=react,react-dom';

        // 停止计时器
        clearInterval(timerInterval);

        const PRODUCTS = [
            { id: 'p1', name: { zh: '经典拿铁', ja: 'ラテ' }, price: 500, image: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400', desc: '口感顺滑' },
            { id: 'p2', name: { zh: '美式咖啡', ja: 'ブラック' }, price: 400, image: 'https://images.unsplash.com/photo-1559496417-e7f25cb247f3?w=400', desc: '香气浓郁' },
            { id: 'p3', name: { zh: '芝士蛋糕', ja: 'ケーキ' }, price: 650, image: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=400', desc: '甜而不腻' }
        ];

        const App = () => {
            const [cart, setCart] = useState([]);
            const [lang, setLang] = useState('zh');
            const [orders, setOrders] = useState([]);
            const rate = 0.048;

            const add = (p) => setCart(curr => {
                const ex = curr.find(x => x.id === p.id);
                return ex ? curr.map(x => x.id === p.id ? {...x, q: x.q+1} : x) : [...curr, {...p, q: 1}];
            });

            const sub = (id) => setCart(curr => curr.map(x => x.id === id ? {...x, q: x.q-1} : x).filter(x => x.q > 0));

            return (
                <HashRouter>
                    <div className="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col relative overflow-hidden">
                        <nav className="glass-nav p-4 flex justify-between items-center sticky top-0 z-50">
                            <Link to="/" className="font-black text-2xl text-indigo-600 italic tracking-tighter">QUICKPICK.</Link>
                            <div className="flex gap-4">
                                <select value={lang} onChange={e => setLang(e.target.value)} className="text-[10px] font-black bg-slate-100 border-none rounded-full px-2">
                                    <option value="zh">CN</option><option value="ja">JP</option>
                                </select>
                                <Link to="/admin" className="text-slate-300"><i className="fa-solid fa-gear"></i></Link>
                            </div>
                        </nav>
                        <main className="flex-1 p-4">
                            <Routes>
                                <Route path="/" element={<Home lang={lang} cart={cart} add={add} sub={sub} rate={rate} />} />
                                <Route path="/checkout" element={<Checkout cart={cart} rate={rate} onDone={(o) => {setOrders([o, ...orders]); setCart([]); return o;}} />} />
                                <Route path="/done/:id" element={<Done orders={orders} />} />
                                <Route path="/admin" element={<Admin orders={orders} />} />
                            </Routes>
                        </main>
                    </div>
                </HashRouter>
            );
        };

        const Home = ({ lang, cart, add, sub, rate }) => {
            const totalQty = cart.reduce((s, i) => s + i.q, 0);
            const totalJPY = cart.reduce((s, i) => s + i.price * i.q, 0);
            return (
                <div className="animate-in">
                    <div className="bg-indigo-600 rounded-[2rem] p-6 text-white mb-6 shadow-xl">
                        <h2 className="text-2xl font-black italic">SHOP ONLINE.</h2>
                        <p className="text-[10px] font-bold opacity-60 mt-1 uppercase tracking-widest">扫码点单 · 柜台自提</p>
                    </div>
                    <div className="space-y-4">
                        {PRODUCTS.map(p => (
                            <div key={p.id} className="flex gap-4 bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
                                <img src={p.image} className="w-24 h-24 object-cover rounded-xl bg-slate-100" />
                                <div className="flex-1 flex flex-col justify-between py-1">
                                    <div>
                                        <h4 className="font-black text-slate-800">{p.name[lang]}</h4>
                                        <p className="text-[10px] text-slate-400">{p.desc}</p>
                                    </div>
                                    <div className="flex justify-between items-end">
                                        <div><p className="text-indigo-600 font-black text-lg">¥{p.price}</p><p className="text-[10px] text-emerald-500 font-bold">≈￥{(p.price * rate).toFixed(2)}</p></div>
                                        <div className="flex items-center gap-3 bg-slate-50 p-1 rounded-full border">
                                            <button onClick={() => sub(p.id)} className="w-6 h-6 rounded-full bg-white border">-</button>
                                            <span className="text-xs font-black w-4 text-center">{cart.find(i => i.id === p.id)?.q || 0}</span>
                                            <button onClick={() => add(p)} className="w-6 h-6 rounded-full bg-slate-900 text-white">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                    {totalQty > 0 && (
                        <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[calc(100%-2rem)] max-w-sm bg-slate-900 text-white p-4 rounded-3xl shadow-2xl flex justify-between items-center border border-slate-700">
                            <div><p className="text-[10px] font-bold opacity-40 uppercase">{totalQty} ITEMS</p><p className="text-lg font-black">¥{totalJPY} JPY</p></div>
                            <Link to="/checkout" className="bg-indigo-600 px-6 py-2 rounded-xl font-black text-sm uppercase">Checkout</Link>
                        </div>
                    )}
                </div>
            );
        };

        const Checkout = ({ cart, rate, onDone }) => {
            const [form, setForm] = useState({ name: '', img: '' });
            const nav = useNavigate();
            const jpy = cart.reduce((s, i) => s + i.price * i.q, 0);
            const cny = (jpy * rate).toFixed(2);
            return (
                <div className="animate-in space-y-6">
                    <h2 className="text-2xl font-black italic tracking-tighter">PAYMENT.</h2>
                    <div className="bg-white p-6 rounded-3xl shadow-xl border border-slate-100 text-center">
                        <p className="text-[10px] font-black text-slate-400 mb-4 tracking-widest uppercase">Scan to pay ￥{cny}</p>
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PAY_CNY" className="mx-auto w-32 h-32 mb-4 bg-slate-50 p-2 rounded-xl" />
                        <label className="block w-full border-2 border-dashed border-slate-200 rounded-2xl p-4 cursor-pointer">
                            <input type="file" onChange={e => { const r = new FileReader(); r.onloadend = () => setForm({...form, img: r.result}); r.readAsDataURL(e.target.files[0]); }} className="hidden" />
                            {form.img ? <img src={form.img} className="w-16 h-16 mx-auto rounded-lg" /> : <p className="text-xs font-bold text-slate-400">上传截图 / Upload Proof</p>}
                        </label>
                    </div>
                    <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="微信昵称 / WeChat Name" className="w-full p-5 rounded-2xl bg-slate-50 border-none font-bold text-sm" />
                    <button onClick={() => { if(!form.name || !form.img) return alert("请填写信息"); const o = onDone({id: Date.now(), name: form.name, code: Math.random().toString(36).substr(2,6).toUpperCase(), cny}); nav(`/done/${o.id}`); }} className="w-full bg-indigo-600 text-white py-5 rounded-3xl font-black text-lg shadow-xl uppercase">Confirm Order</button>
                </div>
            );
        };

        const Done = ({ orders }) => {
            const { id } = useParams();
            const o = orders.find(x => x.id == id);
            return (
                <div className="text-center py-10 animate-in">
                    <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner"><i className="fa-solid fa-check"></i></div>
                    <h2 className="text-3xl font-black italic">SUCCESS.</h2>
                    <div className="mt-8 bg-white p-10 rounded-[3rem] shadow-2xl border border-slate-50">
                        <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.3em]">Pickup Code</p>
                        <p className="text-7xl font-black text-indigo-600 mt-4 tracking-tighter">{o?.code}</p>
                    </div>
                    <Link to="/" className="inline-block mt-12 text-slate-300 font-black text-xs uppercase underline underline-offset-8 decoration-2 decoration-indigo-600">Back to Shop</Link>
                </div>
            );
        };

        const Admin = ({ orders }) => (
            <div className="animate-in space-y-4">
                <h2 className="text-xl font-black italic uppercase">Order List.</h2>
                {orders.map(o => (
                    <div key={o.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center">
                        <div><p className="text-2xl font-black text-indigo-600">{o.code}</p><p className="text-[10px] font-bold text-slate-400 uppercase">{o.name}</p></div>
                        <p className="text-sm font-black text-emerald-500">￥{o.cny}</p>
                    </div>
                ))}
            </div>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
