
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QuickPick | 扫码自提店</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans SC', sans-serif; 
            background-color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
        }
        .order-card { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>

    <!-- 核心运行逻辑 -->
    <script type="module">
        import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { HashRouter, Routes, Route, Link, useNavigate, useParams } from 'https://esm.sh/react-router-dom@6.11.2?external=react,react-dom';

        // --- 预设商品信息 ---
        const PRODUCTS = [
            { id: 1, name: { zh: '招牌生椰拿铁', ja: '生ヤシラテ' }, price: 500, img: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=400', desc: '年度爆款，口感醇厚' },
            { id: 2, name: { zh: '经典美式', ja: 'ブラック' }, price: 400, img: 'https://images.unsplash.com/photo-1559496417-e7f25cb247f3?w=400', desc: '现磨浓缩，提神利器' },
            { id: 3, name: { zh: '红丝绒蛋糕', ja: 'ケーキ' }, price: 680, img: 'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=400', desc: '绵密丝滑，甜度适中' },
            { id: 4, name: { zh: '日式冷萃绿茶', ja: '冷茶' }, price: 450, img: 'https://images.unsplash.com/photo-1556679343-c7306c1976bc?w=400', desc: '清爽解腻，回甘清甜' }
        ];

        const App = () => {
            const [lang, setLang] = useState('zh');
            const [cart, setCart] = useState([]);
            const [orders, setOrders] = useState([]);
            const exchangeRate = 0.048; // 1 JPY = 0.048 CNY

            const addToCart = (p) => {
                setCart(prev => {
                    const ex = prev.find(i => i.id === p.id);
                    return ex ? prev.map(i => i.id === p.id ? {...i, qty: i.qty + 1} : i) : [...prev, {...p, qty: 1}];
                });
            };

            const removeFromCart = (id) => {
                setCart(prev => prev.map(i => i.id === id ? {...i, qty: i.qty - 1} : i).filter(i => i.qty > 0));
            };

            return (
                <HashRouter>
                    <div className="max-w-md mx-auto min-h-screen bg-white shadow-2xl flex flex-col relative">
                        {/* Header */}
                        <header className="sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b px-6 py-4 flex justify-between items-center">
                            <Link to="/" className="text-2xl font-black italic tracking-tighter text-indigo-600">QUICKPICK.</Link>
                            <div className="flex items-center gap-3">
                                <select value={lang} onChange={e => setLang(e.target.value)} className="bg-slate-100 text-[10px] font-bold px-2 py-1 rounded-full outline-none border-none">
                                    <option value="zh">CN</option>
                                    <option value="ja">JP</option>
                                </select>
                                <Link to="/admin" className="text-slate-300 hover:text-indigo-600"><i className="fa-solid fa-user-shield"></i></Link>
                            </div>
                        </header>

                        <main className="flex-1 p-6">
                            <Routes>
                                <Route path="/" element={<Home lang={lang} cart={cart} onAdd={addToCart} onRemove={removeFromCart} rate={exchangeRate} />} />
                                <Route path="/checkout" element={<Checkout cart={cart} rate={exchangeRate} onFinish={(o) => { setOrders([o, ...orders]); setCart([]); return o; }} />} />
                                <Route path="/success/:id" element={<Success orders={orders} />} />
                                <Route path="/admin" element={<Admin orders={orders} />} />
                            </Routes>
                        </main>
                    </div>
                </HashRouter>
            );
        };

        const Home = ({ lang, cart, onAdd, onRemove, rate }) => {
            const totalQty = cart.reduce((s, i) => s + i.qty, 0);
            return (
                <div className="pb-24 order-card">
                    <div className="bg-gradient-to-br from-indigo-600 to-indigo-700 rounded-3xl p-6 text-white mb-8 shadow-xl">
                        <h2 className="text-2xl font-black italic uppercase leading-none">Hello,<br/>Ready to Pick?</h2>
                        <p className="text-[10px] font-bold opacity-60 mt-3 tracking-widest uppercase">中国/日本·自提系统</p>
                    </div>

                    <div className="space-y-5">
                        {PRODUCTS.map(p => {
                            const inCart = cart.find(i => i.id === p.id);
                            return (
                                <div key={p.id} className="flex gap-4 items-center bg-white p-2 rounded-2xl border border-slate-50 shadow-sm">
                                    <img src={p.img} className="w-20 h-20 object-cover rounded-xl shadow-inner" />
                                    <div className="flex-1">
                                        <h3 className="font-bold text-slate-800 text-sm">{p.name[lang]}</h3>
                                        <p className="text-[10px] text-slate-400 mt-0.5 line-clamp-1">{p.desc}</p>
                                        <div className="flex justify-between items-end mt-2">
                                            <div>
                                                <span className="text-indigo-600 font-black text-base">¥{p.price}</span>
                                                <span className="text-[8px] text-emerald-500 font-bold ml-1">≈￥{(p.price * rate).toFixed(2)}</span>
                                            </div>
                                            <div className="flex items-center gap-3 bg-slate-50 p-1 rounded-full shadow-inner">
                                                {inCart && (
                                                    <button onClick={() => onRemove(p.id)} className="w-6 h-6 rounded-full bg-white border flex items-center justify-center text-xs">-</button>
                                                )}
                                                {inCart && <span className="text-xs font-black">{inCart.qty}</span>}
                                                <button onClick={() => onAdd(p)} className="w-6 h-6 rounded-full bg-slate-900 text-white flex items-center justify-center text-xs shadow-md">+</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>

                    {totalQty > 0 && (
                        <Link to="/checkout" className="fixed bottom-8 left-6 right-6 max-w-sm mx-auto bg-slate-900 text-white p-5 rounded-3xl shadow-2xl flex justify-between items-center group transition-all hover:bg-indigo-600">
                            <span className="bg-indigo-500 text-white px-3 py-1 rounded-full text-[10px] font-black">{totalQty} ITEMS</span>
                            <span className="font-black text-sm uppercase tracking-widest">去结算 Checkout</span>
                            <i className="fa-solid fa-arrow-right text-xs group-hover:translate-x-1 transition-transform"></i>
                        </Link>
                    )}
                </div>
            );
        };

        const Checkout = ({ cart, rate, onFinish }) => {
            const [form, setForm] = useState({ name: '', img: '' });
            const nav = useNavigate();
            const totalJPY = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const totalCNY = (totalJPY * rate).toFixed(2);

            const handleFile = (e) => {
                const reader = new FileReader();
                reader.onloadend = () => setForm({...form, img: reader.result});
                reader.readAsDataURL(e.target.files[0]);
            };

            const submit = () => {
                if(!form.name || !form.img) return alert("请完整填写姓名并上传支付凭证");
                const order = onFinish({
                    id: Date.now(),
                    name: form.name,
                    code: Math.random().toString(36).substr(2, 6).toUpperCase(),
                    time: new Date().toLocaleTimeString(),
                    cny: totalCNY,
                    img: form.img
                });
                nav(`/success/${order.id}`);
            };

            return (
                <div className="order-card space-y-6">
                    <h2 className="text-xl font-black italic underline decoration-indigo-200 decoration-4">CHECKOUT.</h2>
                    <div className="bg-slate-50 rounded-3xl p-8 border-2 border-dashed border-slate-200 text-center">
                        <p className="text-[10px] font-black text-slate-400 mb-4 tracking-[0.3em] uppercase">微信/支付宝支付 ￥{totalCNY}</p>
                        <img src={`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=PAY_${totalCNY}`} className="w-32 h-32 mx-auto mb-6 shadow-lg rounded-xl" />
                        <label className="block w-full cursor-pointer bg-white border border-slate-100 p-4 rounded-2xl shadow-sm hover:bg-slate-50 transition-colors">
                            <input type="file" className="hidden" onChange={handleFile} accept="image/*" />
                            {form.img ? (
                                <div className="flex items-center justify-center gap-2 text-indigo-600 font-bold text-xs">
                                    <i className="fa-solid fa-circle-check"></i> 凭证已就绪
                                </div>
                            ) : (
                                <div className="text-slate-400 font-bold text-xs"><i className="fa-solid fa-upload mr-2"></i>上传支付截图</div>
                            )}
                        </label>
                    </div>
                    <input value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="您的微信名/取货姓名" className="w-full p-5 rounded-2xl bg-slate-100 border-none font-bold text-sm focus:ring-2 focus:ring-indigo-600" />
                    <button onClick={submit} className="w-full bg-indigo-600 text-white py-5 rounded-3xl font-black text-lg shadow-xl hover:bg-indigo-700 transition-all active:scale-95">下单生成取货码</button>
                </div>
            );
        };

        const Success = ({ orders }) => {
            const { id } = useParams();
            const o = orders.find(x => x.id == id);
            return (
                <div className="text-center py-10 order-card">
                    <div className="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl"><i className="fa-solid fa-check"></i></div>
                    <h2 className="text-3xl font-black italic">SUCCESS.</h2>
                    <p className="text-slate-400 text-xs font-bold mt-2 uppercase">凭此码到店领取</p>
                    <div className="mt-10 bg-indigo-600 p-12 rounded-[3rem] shadow-2xl relative overflow-hidden">
                        <div className="absolute top-0 left-0 w-full h-1 bg-white/20"></div>
                        <p className="text-white text-6xl font-black tracking-tighter uppercase">{o?.code}</p>
                    </div>
                    <Link to="/" className="inline-block mt-12 text-slate-300 font-black text-xs uppercase underline underline-offset-8">Back to Shop</Link>
                </div>
            );
        };

        const Admin = ({ orders }) => (
            <div className="order-card space-y-6">
                <h2 className="text-xl font-black italic">ADMIN DASHBOARD.</h2>
                <div className="space-y-4">
                    {orders.length === 0 ? (
                        <div className="py-20 text-center text-slate-300 font-bold border-2 border-dashed rounded-3xl">暂无订单</div>
                    ) : orders.map(o => (
                        <div key={o.id} className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex justify-between items-center group">
                            <div className="flex gap-4">
                                <div className="text-center">
                                    <p className="text-xl font-black text-indigo-600 leading-none">{o.code}</p>
                                    <p className="text-[8px] font-bold text-slate-300 mt-1 uppercase">{o.time}</p>
                                </div>
                                <div>
                                    <p className="text-sm font-black text-slate-800 leading-none">{o.name}</p>
                                    <p className="text-[10px] font-bold text-emerald-500 mt-1">￥{o.cny}</p>
                                </div>
                            </div>
                            <button onClick={() => window.open(o.img)} className="text-[10px] font-black bg-slate-100 px-3 py-2 rounded-xl text-slate-400 group-hover:bg-indigo-600 group-hover:text-white transition-all">凭证</button>
                        </div>
                    ))}
                </div>
            </div>
        );

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
